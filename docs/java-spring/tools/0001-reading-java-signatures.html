<p class="kicker">Java &amp; Spring · навык</p>
<h1>Чтение Java-сигнатур</h1>
<p class="lede">Тип перед именем, геттеры-методы, <code>static</code> и <code>final</code>: читать Java-объявление так же быстро,
как TypeScript.</p>
<div id="trainers"></div>
<script>
  // Newest lesson first; within a lesson, the lesson's own order.
  TEACH.trainer("trainers", {
    id: "l02-java-to-ts",   // public deep link: never rename
    title: "Java → TypeScript · 10 сигнатур",
    origin: { label: "Урок 2 · Класс вместо record", href: "../lessons/0002-class-instead-of-record.html" },
    mount: function (stage) {
      return TEACH.runDrill(stage, {
      items: [
        { id: "sig-total", prompt: "<pre>static BigDecimal total(List&lt;Payment&gt; payments)</pre>",
          options: ["static total(payments: Payment[]): BigDecimal",
                    "static total(payments: BigDecimal[]): Payment",
                    "static total(payments: Payment): BigDecimal[]"],
          answer: 0, why: "Тип перед именем — это тип результата; в скобках тип стоит перед именем параметра." },
        { id: "sig-getter", prompt: "<pre>String getAccount()</pre>",
          options: ["getAccount(): string",
                    "get account(): string",
                    "getAccount(account: string): void"],
          answer: 0, why: "В Java геттер — обычный метод, а не TS-аксессор <code>get</code>." },
        { id: "sig-void", prompt: "<pre>void log(String message)</pre>",
          options: ["log(message: string): void",
                    "log(): string",
                    "log(message: void): string"],
          answer: 0, why: "<code>void</code> — тип результата: метод ничего не возвращает." },
        { id: "sig-field", prompt: "<pre>private final BigDecimal amount;</pre>",
          options: ["private readonly amount: BigDecimal;",
                    "private static amount: BigDecimal;",
                    "public amount?: BigDecimal;"],
          answer: 0, why: "<code>final</code> у поля ≈ <code>readonly</code>: присваивается один раз." },
        { id: "sig-const", prompt: "<pre>public static final int MAX_ITEMS = 50;</pre>",
          options: ["static readonly MAX_ITEMS: number = 50;",
                    "readonly MAX_ITEMS: number = 50;",
                    "static MAX_ITEMS: number = 50;"],
          answer: 0, why: "<code>static</code> — одно на класс, <code>final</code> — не меняется. Так в Java пишут константы." },
        { id: "sig-bool", prompt: "<pre>boolean isEmpty()</pre>",
          options: ["isEmpty(): boolean",
                    "isEmpty: boolean",
                    "isEmpty(value: boolean): void"],
          answer: 0, why: "Скобки — значит метод. Для <code>boolean</code> геттеры по соглашению начинаются с <code>is</code>." },
        { id: "sig-list", prompt: "<pre>List&lt;String&gt; names(Payment payment)</pre>",
          options: ["names(payment: Payment): string[]",
                    "names(payment: string[]): Payment",
                    "names(): Payment[]"],
          answer: 0, why: "<code>List&lt;String&gt;</code> перед именем — это результат; параметр — <code>Payment</code>." },
        { id: "sig-map", prompt: "<pre>Map&lt;String, BigDecimal&gt; totalsByAccount()</pre>",
          options: ["totalsByAccount(): Map&lt;string, BigDecimal&gt;",
                    "totalsByAccount(): Map&lt;BigDecimal, string&gt;",
                    "totalsByAccount(map: Map&lt;string, BigDecimal&gt;): void"],
          answer: 0, why: "Порядок дженерик-параметров тот же: сначала ключ, потом значение." },
        { id: "sig-static-method", prompt: "<pre>static int created()</pre>",
          options: ["static created(): number",
                    "created(): number",
                    "static created: number"],
          answer: 0, why: "<code>static</code> — метод класса, скобки — это метод, а не поле." },
        { id: "sig-ctor", prompt: "<pre>PaymentClass(String account, BigDecimal amount)</pre>",
          options: ["constructor(account: string, amount: BigDecimal)",
                    "PaymentClass(account: string, amount: BigDecimal): void",
                    "static create(account: string): PaymentClass"],
          answer: 0, why: "Метод с именем класса и без типа результата — это конструктор." }
      ]
    });
    }
  });
</script>
</main></body></html>
